<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajat Shrivastav | My Favourite Tools</title>
<meta name="description" content="Rajat Shrivastav's personal collection of favourite online tools and websites.">
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --text:#172033; --muted:#697386;
  --primary:#315efb; --primary2:#6d5dfc; --border:#e5e9f2;
  --shadow:0 12px 35px rgba(24,38,72,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f6f8ff,#eef5ff);color:var(--text)}
button,input,select{font:inherit}
.header{
  padding:34px 20px 26px;
  background:linear-gradient(135deg,#172554,#315efb 55%,#6d5dfc);
  color:white;
}
.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:25px;font-weight:800;border:1px solid rgba(255,255,255,.22)}
h1{margin:0;font-size:28px}
.tag{margin:5px 0 0;opacity:.82;font-size:14px}
.actions{display:flex;gap:9px}
.action{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:10px 13px;border-radius:12px;cursor:pointer}
.action:hover{background:rgba(255,255,255,.2)}
.hero{max-width:1180px;margin:24px auto 0}
.search{
  width:100%;padding:17px 20px;border:0;border-radius:16px;outline:none;
  box-shadow:0 10px 30px rgba(0,0,0,.13);font-size:16px
}
.main{max-width:1180px;margin:28px auto;padding:0 20px 50px}
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:24px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer}
.tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.section{margin:26px 0}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.section-title h2{font-size:19px;margin:0}
.section-title span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:17px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;
  transition:.18s transform,.18s box-shadow
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(24,38,72,.13)}
.icon{width:44px;height:44px;border-radius:13px;background:#eef2ff;display:grid;place-items:center;font-size:22px;margin-bottom:13px}
.name{font-weight:750;font-size:15px;padding-right:20px}
.desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.star{position:absolute;right:14px;top:13px;border:0;background:none;cursor:pointer;font-size:19px;color:#b7bfce}
.star.on{color:#f4b400}
.delete{position:absolute;right:11px;bottom:10px;border:0;background:none;color:#b0b7c4;cursor:pointer;display:none;font-size:12px}
.custom .delete{display:block}
.empty{padding:35px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--border);border-radius:16px}
.footer{max-width:1180px;margin:auto;padding:0 20px 35px;color:var(--muted);font-size:12px;text-align:center}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,18,40,.45);z-index:10;align-items:center;justify-content:center;padding:20px}
.modal{width:min(520px,100%);background:white;border-radius:22px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.22)}
.modal h3{margin:0 0 18px}
.form-row{margin:12px 0}
.form-row label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.form-row input,.form-row select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;outline:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{padding:10px 14px;border-radius:11px;border:1px solid var(--border);cursor:pointer;background:white}
.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:22px}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.name{font-size:14px}.desc{font-size:11px}.logo{width:50px;height:50px}.actions .action{padding:8px 10px}}
</style>
</head>
<body>

<header class="header">
  <div class="top">
    <div class="brand">
      <div class="logo">RS</div>
      <div>
        <h1>Rajat Shrivastav</h1>
        <div class="tag">My Favourite Websites & Online Tools</div>
      </div>
    </div>
    <div class="actions">
      <button class="action" onclick="openModal()">＋ Add Website</button>
    </div>
  </div>
  <div class="hero">
    <input id="search" class="search" type="search" placeholder="🔎 Search your favourite tools..." oninput="render()">
  </div>
</header>

<main class="main">
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>

<div class="footer">Rajat Shrivastav • Personal shortcuts dashboard • Your custom websites are saved in this browser.</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3>Add your favourite website</h3>
    <div class="form-row"><label>Website name</label><input id="siteName" placeholder="e.g. My PDF Tool"></div>
    <div class="form-row"><label>Website URL</label><input id="siteUrl" placeholder="https://example.com"></div>
    <div class="form-row">
      <label>Category</label>
      <select id="siteCategory">
        <option>PDF & Documents</option><option>Image Tools</option><option>Online Tools</option>
        <option>Bihar Services</option><option>Other</option>
      </select>
    </div>
    <div class="form-row"><label>Icon (emoji)</label><input id="siteIcon" value="🔗" maxlength="2"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="addSite()">Add Website</button>
    </div>
  </div>
</div>

<script>
const builtIn = [
  {name:"Pi7 Image Tool", desc:"Compress, resize, convert & edit images", cat:"Image Tools", icon:"🖼️", url:"https://image.pi7.org/"},
  {name:"Pi7 PDF Tool", desc:"PDF compression and other PDF tools", cat:"PDF & Documents", icon:"📄", url:"https://pdf.pi7.org/"},
  {name:"Sejda PDF", desc:"PDF editor, merge, split, compress & more", cat:"PDF & Documents", icon:"✏️", url:"https://www.sejda.com/"},
  {name:"Sejda PDF Editor", desc:"Edit and sign PDF files online", cat:"PDF & Documents", icon:"📝", url:"https://www.sejda.com/pdf-editor"},
  {name:"TinyWow", desc:"PDF, image, file, video & AI tools", cat:"Online Tools", icon:"✨", url:"https://tinywow.com/"},
  {name:"ToolFK", desc:"All-in-one online tools", cat:"Online Tools", icon:"🛠️", url:"https://www.toolfk.com/"},
  {name:"WhatsApp Web", desc:"Open WhatsApp on your computer", cat:"Online Tools", icon:"💬", url:"https://web.whatsapp.com/"},
  {name:"Chrome Web Store", desc:"Find Chrome extensions & apps", cat:"Online Tools", icon:"🌐", url:"https://chromewebstore.google.com/"},
  {name:"eNibandhan Bihar", desc:"Bihar registration services portal", cat:"Bihar Services", icon:"🏛️", url:"https://enibandhan.bihar.gov.in/"},
  {name:"Bihar Registration Department", desc:"Official Bihar registration department", cat:"Bihar Services", icon:"📜", url:"https://nibandhan.bihar.gov.in/"},
  {name:"Bihar Bhumi", desc:"Bihar revenue & land services", cat:"Bihar Services", icon:"🌾", url:"https://biharbhumi.bihar.gov.in/"},
  {name:"Bhumi Jankari", desc:"Bihar property registration information", cat:"Bihar Services", icon:"🏠", url:"https://bhumijankari.bihar.gov.in/"},
  {name:"BR News", desc:"Your saved news shortcut", cat:"Other", icon:"📰", url:"https://www.google.com/search?q=BR+News+Bihar"},
  {name:"All in One Website", desc:"Your all-in-one web shortcut", cat:"Other", icon:"⭐", url:"https://www.google.com/"},
  {name:"Kruti Dev to Hindi", desc:"Search shortcut for Kruti Dev conversion", cat:"Other", icon:"अ", url:"https://www.google.com/search?q=Kruti+Dev+to+Hindi+converter"}
];

let custom = JSON.parse(localStorage.getItem("rajatSites") || "[]");
let favourites = JSON.parse(localStorage.getItem("rajatFavs") || "[]");
let active = "All";

function save(){
  localStorage.setItem("rajatSites", JSON.stringify(custom));
  localStorage.setItem("rajatFavs", JSON.stringify(favourites));
}
function allSites(){ return builtIn.concat(custom.map(x=>({...x,custom:true}))); }
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function renderTabs(){
  const cats=["All","⭐ Favourites","PDF & Documents","Image Tools","Online Tools","Bihar Services","Other"];
  document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="tab ${active===c?'active':''}" onclick="active=${JSON.stringify(c)};render()">${c}</button>`).join("");
}

function render(){
  renderTabs();
  const q=document.getElementById("search").value.toLowerCase().trim();
  let sites=allSites().filter(s=>{
    const matchQ=!q || (s.name+" "+s.desc+" "+s.cat).toLowerCase().includes(q);
    const matchCat=active==="All" || (active==="⭐ Favourites" ? favourites.includes(s.url) : s.cat===active);
    return matchQ && matchCat;
  });
  const groups=active==="All" && !q ? ["PDF & Documents","Image Tools","Online Tools","Bihar Services","Other"] : [active==="⭐ Favourites" ? "⭐ Favourites" : active];
  let html="";
  groups.forEach(g=>{
    let list=sites.filter(s=>g==="⭐ Favourites" ? favourites.includes(s.url) : s.cat===g);
    if(!list.length) return;
    html+=`<section class="section"><div class="section-title"><h2>${esc(g)}</h2><span>${list.length} shortcut${list.length>1?"s":""}</span></div><div class="grid">`;
    list.forEach(s=>{
      const isFav=favourites.includes(s.url);
      html+=`<div class="card ${s.custom?'custom':''}">
        <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">
          <div class="icon">${esc(s.icon||"🔗")}</div>
          <div class="name">${esc(s.name)}</div>
          <div class="desc">${esc(s.desc)}</div>
        </a>
        <button class="star ${isFav?'on':''}" title="Favourite" onclick='toggleFav(${JSON.stringify(s.url)})'>${isFav?"★":"☆"}</button>
        ${s.custom?`<button class="delete" onclick='deleteSite(${JSON.stringify(s.url)})'>Delete</button>`:""}
      </div>`;
    });
    html+="</div></section>";
  });
  if(!html) html='<div class="empty">No website found. Try another search or add a website.</div>';
  document.getElementById("content").innerHTML=html;
}
function toggleFav(url){
  favourites=favourites.includes(url)?favourites.filter(x=>x!==url):[...favourites,url];
  save();render();
}
function deleteSite(url){
  if(!confirm("Delete this custom website?")) return;
  custom=custom.filter(x=>x.url!==url);
  favourites=favourites.filter(x=>x!==url);
  save();render();
}
function openModal(){document.getElementById("modal").style.display="flex";document.getElementById("siteName").focus()}
function closeModal(){document.getElementById("modal").style.display="none"}
function addSite(){
  const name=document.getElementById("siteName").value.trim();
  let url=document.getElementById("siteUrl").value.trim();
  const cat=document.getElementById("siteCategory").value;
  const icon=document.getElementById("siteIcon").value.trim()||"🔗";
  if(!name||!url){alert("Website name and URL are required.");return}
  if(!/^https?:\/\//i.test(url)) url="https://"+url;
  custom.push({name,desc:"Custom favourite website",cat,icon,url});
  save();
  document.getElementById("siteName").value="";
  document.getElementById("siteUrl").value="";
  closeModal(); active="All"; render();
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
